global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'countypay-monitor'

scrape_configs:
  # Backend service
  - job_name: 'countypay-backend'
    static_configs:
      - targets: ['localhost:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
